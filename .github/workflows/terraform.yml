name: Terraform CI/CD — Book Review App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.5.0

jobs:

  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: DEBUG AWS
        run: |
          echo "Access Key Length:"
          echo ${#AWS_ACCESS_KEY_ID}
          echo "Trying AWS identity..."
          aws sts get-caller-identity

      - name: Clean Terraform cache
        run: rm -rf .terraform .terraform.lock.hcl

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate


  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: DEBUG AWS
        run: |
          echo "Access Key Length:"
          echo ${#AWS_ACCESS_KEY_ID}
          echo "Trying AWS identity..."
          aws sts get-caller-identity

      - name: Clean Terraform cache
        run: rm -rf .terraform .terraform.lock.hcl

      - name: Terraform Init
        run: terraform init

      # 🔥 IMPORTANT FIX (DESTROY HYDERABAD RESOURCES)
      - name: Destroy Hyderabad resources
        run: |
          terraform destroy -auto-approve \
            -target=module.vpc_hyderabad \
            -target=module.security_groups_hyderabad \
            -target=module.alb_hyderabad \
            -target=module.rds_hyderabad \
            -target=module.asg_hyderabad \
            -target=module.cloudwatch_hyderabad

      # ⛔ TEMPORARILY DISABLED
      # - name: Terraform Plan
      #   run: |
      #     terraform plan \
      #       -var="db_username=${{ secrets.DB_USERNAME }}" \
      #       -var="db_password=${{ secrets.DB_PASSWORD }}" \
      #       -var="alert_email=${{ secrets.ALERT_EMAIL }}"


  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: DEBUG AWS
        run: |
          echo "Access Key Length:"
          echo ${#AWS_ACCESS_KEY_ID}
          echo "Trying AWS identity..."
          aws sts get-caller-identity

      - name: Clean Terraform cache
        run: rm -rf .terraform .terraform.lock.hcl

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}"

      - name: Output ALB DNS
        run: |
          echo "Mumbai ALB: $(terraform output -raw alb_dns_mumbai)"
